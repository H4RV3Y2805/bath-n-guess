<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Character!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;--card:#16213e;--accent:#e94560;--accent2:#0f3460;
  --gold:#f5c518;--text:#eee;--dim:#999;--green:#2ecc71;--blue:#3498db;
  --radius:16px;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;
  overflow-x:hidden;
}
h1{
  font-size:2rem;text-align:center;margin:12px 0 4px;
  background:linear-gradient(135deg,var(--gold),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{color:var(--dim);font-size:.85rem;margin-bottom:16px;text-align:center}

/* Scoreboard */
.scoreboard{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;
}
.score-card{
  background:var(--card);border:1px solid #ffffff15;border-radius:var(--radius);
  padding:10px 18px;text-align:center;min-width:90px;
}
.score-card .score-name{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:2px}
.score-card .score-value{font-size:1.6rem;font-weight:800;color:var(--gold)}
.score-card.mum{border-color:#e74c8840}
.score-card.mum .score-value{color:#e74c88}
.score-card.dad{border-color:#3498db40}
.score-card.dad .score-value{color:#3498db}
.score-card.aiden{border-color:#2ecc7140}
.score-card.aiden .score-value{color:#2ecc71}

.top-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.stat-pill{
  background:var(--card);border:1px solid #ffffff15;border-radius:20px;
  padding:6px 14px;font-size:.8rem;color:var(--dim);
}
.stat-pill b{color:var(--gold)}
button{
  cursor:pointer;border:none;font-family:inherit;font-weight:600;
  transition:transform .15s,box-shadow .15s;
}
button:active{transform:scale(.96)}
.btn-random{
  background:linear-gradient(135deg,var(--accent),#c0392b);color:#fff;
  font-size:1.2rem;padding:14px 36px;border-radius:40px;
  box-shadow:0 4px 20px #e9456050;letter-spacing:.5px;
}
.btn-random:hover{box-shadow:0 6px 28px #e9456080}
.btn-small{
  background:var(--accent2);color:var(--text);font-size:.85rem;
  padding:8px 18px;border-radius:20px;
}
.btn-small:hover{background:#1a4a80}
.game-area{
  width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;
  margin-top:12px;
}
.clue-card{
  background:var(--card);border:2px solid #ffffff10;border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:border-color .3s,background .3s;
  position:relative;overflow:hidden;
}
.clue-card.locked{opacity:.6}
.clue-card.locked::after{
  content:'Tap to reveal';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;background:#16213ef0;
  font-weight:600;color:var(--gold);font-size:.95rem;letter-spacing:.5px;
}
.clue-card.revealed{border-color:var(--gold);background:#1a2744}
.clue-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:4px}
.clue-text{font-size:1rem;line-height:1.5}
.reveal-section{text-align:center;margin:8px 0}
.btn-reveal{
  background:linear-gradient(135deg,var(--gold),#e67e22);color:#1a1a2e;
  font-size:1.1rem;padding:12px 32px;border-radius:30px;
  box-shadow:0 4px 16px #f5c51840;
}
.pokemon-reveal{
  background:var(--card);border:2px solid var(--gold);border-radius:var(--radius);
  padding:20px;text-align:center;animation:popIn .4s ease;
}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.pokemon-name{font-size:2rem;font-weight:800;color:var(--gold);margin-bottom:12px}
.facts-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;
}
.fact{background:#0d1b30;border-radius:10px;padding:10px 12px}
.fact-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:2px}
.fact-value{font-size:.95rem;font-weight:600}
.type-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.type-badge{
  padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700;
  color:#fff;text-transform:uppercase;letter-spacing:.5px;
}

/* Winner buttons */
.winner-section{margin-top:14px}
.winner-label{font-size:.8rem;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.winner-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-winner{
  font-size:1rem;padding:10px 24px;border-radius:24px;font-weight:700;
  letter-spacing:.5px;transition:transform .15s,box-shadow .15s;
}
.btn-winner:active{transform:scale(.94)}
.btn-winner.mum{background:linear-gradient(135deg,#e74c88,#c0392b);color:#fff}
.btn-winner.dad{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff}
.btn-winner.aiden{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.btn-winner.mum:hover{box-shadow:0 4px 16px #e74c8860}
.btn-winner.dad:hover{box-shadow:0 4px 16px #3498db60}
.btn-winner.aiden:hover{box-shadow:0 4px 16px #2ecc7160}
.winner-recorded{
  color:var(--gold);font-weight:700;font-size:1rem;margin-top:8px;
  animation:popIn .3s ease;
}

.history-section{
  width:100%;max-width:520px;margin-top:24px;
}
.history-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
}
.history-header h3{font-size:.9rem;color:var(--dim)}
.history-list{display:flex;flex-wrap:wrap;gap:6px}
.history-chip{
  background:var(--card);border:1px solid #ffffff10;border-radius:12px;
  padding:4px 10px;font-size:.75rem;color:var(--dim);
}
.hidden{display:none!important}

/* Franchise & gen filter */
.filter-section{
  width:100%;max-width:520px;margin-bottom:12px;
}
.filter-group{
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;
}
.filter-group-label{
  font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
  text-align:center;margin-bottom:4px;
}
.gen-filter{
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;
}
.gen-btn{
  background:var(--card);color:var(--dim);font-size:.72rem;
  padding:4px 10px;border-radius:12px;border:1px solid #ffffff10;
}
.gen-btn.active{background:var(--accent2);color:var(--text);border-color:var(--blue)}
.fran-btn{
  background:var(--card);color:var(--dim);font-size:.76rem;
  padding:5px 12px;border-radius:12px;border:1px solid #ffffff10;font-weight:600;
}
.fran-btn.active{color:var(--text);border-color:var(--blue)}
.fran-btn.active.pokemon{background:#e94560}
.fran-btn.active.minecraft{background:#5d8a3c}
.fran-btn.active.bugsnax{background:#e67e22}
.fran-btn.active.mario{background:#e4002b}
.btn-reset-scores{
  background:#333;color:var(--dim);font-size:.7rem;padding:4px 12px;border-radius:12px;
  border:1px solid #ffffff10;margin-top:4px;
}
.btn-reset-scores:hover{color:var(--text);border-color:#ffffff30}

.footer{margin-top:auto;padding-top:24px;color:#444;font-size:.7rem;text-align:center}

/* Type colours */
.type-normal{background:#a8a878}.type-fire{background:#f08030}.type-water{background:#6890f0}
.type-electric{background:#f8d030;color:#333}.type-grass{background:#78c850}.type-ice{background:#98d8d8;color:#333}
.type-fighting{background:#c03028}.type-poison{background:#a040a0}.type-ground{background:#e0c068;color:#333}
.type-flying{background:#a890f0}.type-psychic{background:#f85888}.type-bug{background:#a8b820;color:#333}
.type-rock{background:#b8a038}.type-ghost{background:#705898}.type-dragon{background:#7038f8}
.type-dark{background:#705848}.type-steel{background:#b8b8d0;color:#333}.type-fairy{background:#ee99ac;color:#333}
/* Franchise type colours */
.type-hostile{background:#c0392b}.type-passive{background:#27ae60}.type-neutral{background:#7f8c8d}
.type-boss{background:#8e44ad}.type-npc{background:#2980b9}.type-undead{background:#505050}
.type-arthropod{background:#6b8e23}.type-grumpus{background:#e67e22}
.type-hero{background:#e4002b}.type-villain{background:#6c3483}.type-power-up{background:#f39c12;color:#333}
.type-ally{background:#1abc9c}.type-koopaling{background:#229954}
</style>
</head>
<body>

<h1>Guess the Character!</h1>
<p class="subtitle">Bath-time Edition</p>

<!-- Scoreboard -->
<div class="scoreboard" id="scoreboard">
  <div class="score-card mum"><div class="score-name">Mum</div><div class="score-value" id="score-mum">0</div></div>
  <div class="score-card dad"><div class="score-name">Dad</div><div class="score-value" id="score-dad">0</div></div>
  <div class="score-card aiden"><div class="score-name">Aiden</div><div class="score-value" id="score-aiden">0</div></div>
</div>

<div class="top-bar">
  <span class="stat-pill">Seen: <b id="seen-count">0</b></span>
  <span class="stat-pill">Round: <b id="total-count">0</b></span>
</div>

<!-- Franchise filters -->
<div class="filter-section">
  <div class="filter-group-label">Franchises</div>
  <div class="filter-group" id="franchise-filter"></div>
  <div class="filter-group-label" id="gen-label">Pokemon Generations</div>
  <div class="gen-filter" id="gen-filter"></div>
</div>

<button class="btn-random" id="btn-random" onclick="pickRandom()">Random Character!</button>

<div class="game-area hidden" id="game-area">
  <div class="clue-card locked" id="clue-1" onclick="revealClue(1)">
    <div class="clue-label">Clue 1</div>
    <div class="clue-text" id="clue-text-1"></div>
  </div>
  <div class="clue-card locked" id="clue-2" onclick="revealClue(2)">
    <div class="clue-label">Clue 2</div>
    <div class="clue-text" id="clue-text-2"></div>
  </div>
  <div class="clue-card locked" id="clue-3" onclick="revealClue(3)">
    <div class="clue-label">Clue 3</div>
    <div class="clue-text" id="clue-text-3"></div>
  </div>

  <div class="pokemon-reveal hidden" id="pokemon-reveal">
    <div class="pokemon-name" id="pokemon-name"></div>
    <div class="facts-grid" id="facts-grid"></div>

    <!-- Winner buttons -->
    <div class="winner-section" id="winner-section">
      <div class="winner-label">Who guessed it?</div>
      <div class="winner-buttons" id="winner-buttons">
        <button class="btn-winner mum" onclick="recordWinner('mum')">Mum</button>
        <button class="btn-winner dad" onclick="recordWinner('dad')">Dad</button>
        <button class="btn-winner aiden" onclick="recordWinner('aiden')">Aiden</button>
      </div>
      <div class="winner-recorded hidden" id="winner-recorded"></div>
    </div>

    <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn-small" onclick="pickRandom()">Next Character</button>
      <button class="btn-small" id="btn-fav" onclick="toggleFav()">Add to Favourites</button>
    </div>
  </div>
</div>

<div class="history-section" id="history-section">
  <div class="history-header">
    <h3 id="history-title">Recently Seen</h3>
    <button class="btn-small" onclick="toggleHistory()" id="btn-toggle-hist">Show Favourites</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<div style="text-align:center;margin-top:16px">
  <button class="btn-reset-scores" onclick="resetScores()">Reset Scores</button>
</div>

<div class="footer">100% offline &middot; data saved on this device</div>

// ── Combine all characters ──
function getAllCharacters(){
  const all = [];
  POKEMON.forEach(p => all.push({...p, franchise:'pokemon'}));
  MINECRAFT.forEach(m => all.push({...m, franchise:'minecraft'}));
  BUGSNAX.forEach(b => all.push({...b, franchise:'bugsnax'}));
  MARIO.forEach(m => all.push({...m, franchise:'mario'}));
  return all;
}

const ALL_CHARACTERS = getAllCharacters();

// ── State ──
let current = null;
let cluesRevealed = 0;
let showingFavs = false;
let activeFranchises = new Set(); // tracks which are toggled OFF
let activeGens = new Set();
let roundWinnerRecorded = false;

// Shuffle bag for no-repeat random
let shuffleBag = [];
let lastPoolKey = '';

// ── Firebase config ──
const FB_DB = 'https://bath-n-guess-default-rtdb.europe-west1.firebasedatabase.app';

// ── localStorage helpers (local data: seen, favourites, totalPlayed) ──
const STORE_KEY = 'pokemon_guess_v2';
function loadData(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if(d) return d;
    const old = JSON.parse(localStorage.getItem('pokemon_guess_v1'));
    if(old) return {...old, scores:{mum:0,dad:0,aiden:0}};
    return {seen:[],favourites:[],totalPlayed:0,scores:{mum:0,dad:0,aiden:0}};
  }catch{return {seen:[],favourites:[],totalPlayed:0,scores:{mum:0,dad:0,aiden:0}}}
}
function saveData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d))}

// ── Firebase score sync ──
let cloudScores = {mum:0,dad:0,aiden:0};

async function fbLoadScores(){
  try{
    const r = await fetch(FB_DB+'/scores.json');
    const data = await r.json();
    if(data && typeof data.mum==='number'){
      cloudScores = data;
      // Sync to local
      const local = loadData();
      local.scores = {...cloudScores};
      saveData(local);
      updateScoreboardUI();
    }
  }catch(e){console.log('Firebase read failed, using local scores');}
}

async function fbSaveScores(scores){
  cloudScores = {...scores};
  try{
    await fetch(FB_DB+'/scores.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(scores)
    });
  }catch(e){console.log('Firebase write failed, scores saved locally');}
}

// Poll for score changes every 5 seconds so both phones stay in sync
setInterval(fbLoadScores, 5000);

// ── Init ──
function init(){
  buildFranchiseFilter();
  buildGenFilter();
  updateStats();
  fbLoadScores(); // load shared scores from Firebase
  renderHistory();
}

function buildFranchiseFilter(){
  const el = document.getElementById('franchise-filter');
  const franchises = [
    {id:'pokemon',label:'Pokemon',cls:'pokemon'},
    {id:'minecraft',label:'Minecraft',cls:'minecraft'},
    {id:'bugsnax',label:'Bugsnax',cls:'bugsnax'},
    {id:'mario',label:'Mario',cls:'mario'},
  ];
  franchises.forEach(f=>{
    const btn = document.createElement('button');
    btn.className = 'fran-btn active '+f.cls;
    btn.textContent = f.label;
    btn.dataset.franchise = f.id;
    btn.onclick = ()=>{
      btn.classList.toggle('active');
      if(btn.classList.contains('active')){
        // Was toggled back ON
        activeFranchises.delete(f.id);
      }else{
        // Toggled OFF
        activeFranchises.add(f.id);
      }
      // Ensure at least one franchise remains active
      if(activeFranchises.size >= franchises.length){
        // Can't turn off all - re-enable this one
        activeFranchises.delete(f.id);
        btn.classList.add('active');
        return;
      }
      updateGenFilterVisibility();
      resetShuffleBag();
    };
    el.appendChild(btn);
  });
}

function updateGenFilterVisibility(){
  const pokemonOff = activeFranchises.has('pokemon');
  document.getElementById('gen-filter').style.display = pokemonOff ? 'none' : '';
  document.getElementById('gen-label').style.display = pokemonOff ? 'none' : '';
}

function buildGenFilter(){
  const gens = [...new Set(POKEMON.map(p=>p.gen))].sort((a,b)=>a-b);
  const el = document.getElementById('gen-filter');
  const allBtn = document.createElement('button');
  allBtn.className = 'gen-btn active';
  allBtn.textContent = 'All';
  allBtn.id = 'gen-all';
  allBtn.onclick = ()=>{
    activeGens.clear();
    document.querySelectorAll('.gen-btn').forEach(b=>b.classList.remove('active'));
    allBtn.classList.add('active');
    resetShuffleBag();
  };
  el.appendChild(allBtn);
  gens.forEach(g=>{
    const btn = document.createElement('button');
    btn.className = 'gen-btn';
    btn.textContent = 'Gen '+g;
    btn.onclick = ()=>{
      document.getElementById('gen-all').classList.remove('active');
      if(activeGens.has(g)){activeGens.delete(g);btn.classList.remove('active')}
      else{activeGens.add(g);btn.classList.add('active')}
      if(activeGens.size===0) document.getElementById('gen-all').classList.add('active');
      resetShuffleBag();
    };
    el.appendChild(btn);
  });
}

function getPool(){
  let pool = ALL_CHARACTERS;
  // Filter by franchise (activeFranchises tracks which are OFF)
  if(activeFranchises.size > 0){
    pool = pool.filter(c => !activeFranchises.has(c.franchise));
  }
  // Filter Pokemon by gen if specific gens selected
  if(activeGens.size > 0){
    pool = pool.filter(c => {
      if(c.franchise === 'pokemon') return activeGens.has(c.gen);
      return true;
    });
  }
  return pool;
}

// ── Shuffle bag for no-repeat random ──
function getPoolKey(){
  return JSON.stringify([...activeFranchises].sort()) + '|' + JSON.stringify([...activeGens].sort());
}

function resetShuffleBag(){
  shuffleBag = [];
  lastPoolKey = '';
}

function pickFromShuffleBag(pool){
  const key = getPoolKey();
  if(key !== lastPoolKey || shuffleBag.length === 0){
    // Refill with Fisher-Yates shuffle
    shuffleBag = pool.map((_,i) => i);
    for(let i = shuffleBag.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleBag[i], shuffleBag[j]] = [shuffleBag[j], shuffleBag[i]];
    }
    lastPoolKey = key;
  }
  return pool[shuffleBag.pop()];
}

function pickRandom(){
  const pool = getPool();
  if(pool.length===0) return;

  current = pickFromShuffleBag(pool);
  cluesRevealed = 0;
  roundWinnerRecorded = false;

  // Reset UI
  document.getElementById('game-area').classList.remove('hidden');
  for(let i=1;i<=3;i++){
    const card = document.getElementById('clue-'+i);
    card.classList.add('locked');
    card.classList.remove('revealed');
    document.getElementById('clue-text-'+i).textContent = current.clues[i-1];
  }

  showCharacterFacts();

  // Track
  const data = loadData();
  if(!data.seen.includes(current.name)) data.seen.push(current.name);
  data.totalPlayed++;
  saveData(data);
  updateStats();
  renderHistory();

  document.getElementById('game-area').scrollIntoView({behavior:'smooth',block:'start'});
}

function showCharacterFacts(){
  const reveal = document.getElementById('pokemon-reveal');
  reveal.classList.remove('hidden');
  document.getElementById('pokemon-name').textContent = current.name;

  const grid = document.getElementById('facts-grid');
  grid.innerHTML = '';

  const franchiseLabels = {pokemon:'Pokemon',minecraft:'Minecraft',bugsnax:'Bugsnax',mario:'Mario'};

  const facts = [
    {label:'Type',value:current.types,isType:true},
    {label:'Category',value:current.category},
    {label:'Franchise',value:franchiseLabels[current.franchise]||current.franchise},
    {label:'Game',value:current.game},
    {label:'Height',value:current.height},
    {label:'Weight',value:current.weight},
  ];
  if(current.gen) facts.splice(3,0,{label:'Generation',value:'Gen '+current.gen});

  facts.forEach(f=>{
    const div = document.createElement('div');
    div.className = 'fact';
    if(f.isType){
      div.innerHTML = '<div class="fact-label">'+f.label+'</div><div class="type-badges">'+f.value.map(t=>'<span class="type-badge type-'+t.toLowerCase()+'">'+t+'</span>').join('')+'</div>';
    }else{
      div.innerHTML = '<div class="fact-label">'+f.label+'</div><div class="fact-value">'+f.value+'</div>';
    }
    grid.appendChild(div);
  });

  // Reset winner section
  document.getElementById('winner-buttons').classList.remove('hidden');
  document.getElementById('winner-recorded').classList.add('hidden');

  // Update fav button
  const data = loadData();
  const isFav = data.favourites.includes(current.name);
  document.getElementById('btn-fav').textContent = isFav ? 'Remove from Favourites' : 'Add to Favourites';
}

function revealClue(n){
  if(n > cluesRevealed+1) return;
  const card = document.getElementById('clue-'+n);
  if(card.classList.contains('revealed')) return;
  card.classList.remove('locked');
  card.classList.add('revealed');
  cluesRevealed = n;
  if(n<3){
    document.getElementById('clue-'+(n+1)).classList.remove('locked');
    document.getElementById('clue-'+(n+1)).classList.add('locked');
  }
}

// ── Winner system ──
function recordWinner(who){
  if(roundWinnerRecorded) return;
  roundWinnerRecorded = true;

  cloudScores[who]++;
  // Save to both local and Firebase
  const data = loadData();
  data.scores = {...cloudScores};
  saveData(data);
  fbSaveScores(cloudScores);

  updateScoreboardUI();

  const names = {mum:'Mum',dad:'Dad',aiden:'Aiden'};
  document.getElementById('winner-buttons').classList.add('hidden');
  const recorded = document.getElementById('winner-recorded');
  recorded.textContent = names[who] + ' gets the point!';
  recorded.classList.remove('hidden');
}

function updateScoreboardUI(){
  document.getElementById('score-mum').textContent = cloudScores.mum;
  document.getElementById('score-dad').textContent = cloudScores.dad;
  document.getElementById('score-aiden').textContent = cloudScores.aiden;
}

function resetScores(){
  cloudScores = {mum:0,dad:0,aiden:0};
  const data = loadData();
  data.scores = {mum:0,dad:0,aiden:0};
  saveData(data);
  fbSaveScores(cloudScores);
  updateScoreboardUI();
}

function toggleFav(){
  if(!current) return;
  const data = loadData();
  const idx = data.favourites.indexOf(current.name);
  if(idx===-1){data.favourites.push(current.name)}
  else{data.favourites.splice(idx,1)}
  saveData(data);
  const isFav = data.favourites.includes(current.name);
  document.getElementById('btn-fav').textContent = isFav ? 'Remove from Favourites' : 'Add to Favourites';
  renderHistory();
}

function updateStats(){
  const data = loadData();
  document.getElementById('seen-count').textContent = data.seen.length;
  document.getElementById('total-count').textContent = data.totalPlayed;
}

function toggleHistory(){
  showingFavs = !showingFavs;
  document.getElementById('btn-toggle-hist').textContent = showingFavs ? 'Show Recent' : 'Show Favourites';
  document.getElementById('history-title').textContent = showingFavs ? 'Favourites' : 'Recently Seen';
  renderHistory();
}

function renderHistory(){
  const data = loadData();
  const list = showingFavs ? data.favourites : data.seen.slice(-20).reverse();
  const el = document.getElementById('history-list');
  el.innerHTML = '';
  if(list.length===0){
    el.innerHTML = '<span style="color:var(--dim);font-size:.8rem">'+(showingFavs?'No favourites yet':'No characters seen yet')+'</span>';
    return;
  }
  list.forEach(name=>{
    const chip = document.createElement('span');
    chip.className = 'history-chip';
    chip.textContent = name;
    el.appendChild(chip);
  });
}

init();
</script>
</body>
</html>
